name: Deploy Jekyll to FTP and GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check image sizes (GitHub Camo 5MB limit)
        # GitHub proxies external images (e.g. blog-post teasers shown on the
        # profile Recent Blog Posts section) through its Camo proxy, which
        # 404s anything over 5 MiB and renders it as a broken image. Fail the
        # build if any image in assets/images/ exceeds a safe 5,000,000-byte
        # threshold so the problem is caught before deploy, not on the profile.
        run: |
          MAX=5000000
          FAIL=0
          while IFS= read -r -d '' img; do
            size=$(stat -c%s "$img")
            if [ "$size" -gt "$MAX" ]; then
              printf '::error file=%s::%s is %s bytes (> %s limit); resize it (e.g. sips --resampleWidth 1600) or GitHub Camo will 404 it.\n' "$img" "$img" "$size" "$MAX"
              FAIL=1
            fi
          done < <(find assets/images -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.gif' -o -iname '*.webp' \) -print0)
          if [ "$FAIL" -ne 0 ]; then
            echo "One or more images exceed the ${MAX}-byte Camo limit. See errors above."
            exit 1
          fi
          echo "All images are under the ${MAX}-byte Camo limit."

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Jekyll dependencies
        # This safely checks if you use a Gemfile or just vanilla Jekyll
        run: |
          gem install jekyll bundler
          if [ -f Gemfile ]; then bundle install; fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # --- 1. BUILD & DEPLOY FOR FTP ---
      - name: Create FTP Config Override
        # Added the pipe (|) below to fix the YAML colon parsing error
        run: |
          echo -e 'url: "http://stevenmatison.com"\nbaseurl: ""' > _config_ftp.yml

      - name: Build for FTP
        run: |
          if [ -f Gemfile ]; then
            JEKYLL_ENV=production bundle exec jekyll build --config _config.yml,_config_ftp.yml --destination ./_site_ftp
          else
            JEKYLL_ENV=production jekyll build --config _config.yml,_config_ftp.yml --destination ./_site_ftp
          fi

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./_site_ftp/
          server-dir: /
          protocol: ftp

      # --- 2. BUILD & DEPLOY FOR GITHUB PAGES ---
      - name: Create GitHub Pages Config Override
        # Added the pipe (|) below to fix the YAML colon parsing error
        run: |
          echo -e 'url: "https://cldr-steven-matison.github.io"\nbaseurl: ""' > _config_gh.yml

      - name: Build for GitHub Pages
        run: |
          if [ -f Gemfile ]; then
            JEKYLL_ENV=production bundle exec jekyll build --config _config.yml,_config_gh.yml --destination ./_site_gh
          else
            JEKYLL_ENV=production jekyll build --config _config.yml,_config_gh.yml --destination ./_site_gh
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site_gh

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4