<!-- ===== SRM terminal chrome: matrix rain + tron grid + CRT + boot screen ===== -->
<canvas id="matrix" aria-hidden="true"></canvas>
<div class="grid-floor" aria-hidden="true"></div>

<div id="boot" aria-hidden="true">
  <div id="bootlog"></div>
  <div id="srmlogo">
    <pre id="asciiart"></pre>
    <div class="tagline">Steven&nbsp;R.&nbsp;Matison&nbsp;//&nbsp;Systems&nbsp;Online</div>
  </div>
</div>

<div class="crt" aria-hidden="true"></div>

<script>
(function(){
  /* ---------- Matrix rain (always on, behind content) ---------- */
  var c=document.getElementById('matrix'),x=c.getContext('2d'),cols,drops;
  var chars="01".split("");
  function resize(){c.width=innerWidth;c.height=innerHeight;
    cols=Math.floor(c.width/14);drops=new Array(cols).fill(1);}
  resize();addEventListener('resize',resize);
  function draw(){
    x.fillStyle="rgba(5,7,10,0.08)";x.fillRect(0,0,c.width,c.height);
    x.font="14px 'Share Tech Mono',monospace";
    for(var i=0;i<cols;i++){
      var ch=chars[Math.floor(Math.random()*chars.length)],y=drops[i]*14;
      x.fillStyle=Math.random()>0.975?"#00f0ff":"#00ff41";
      x.fillText(ch,i*14,y);
      if(y>c.height&&Math.random()>0.975)drops[i]=0;
      drops[i]++;
    }
  }
  setInterval(draw,55);

  /* ---------- Boot sequence (once per session) ---------- */
  var ASCII=
  "  ███████╗ ██████╗ ███╗   ███╗\n"+
  "  ██╔════╝ ██╔══██╗████╗ ████║\n"+
  "  ███████╗ ██████╔╝██╔████╔██║\n"+
  "  ╚════██║ ██╔══██╗██║╚██╔╝██║\n"+
  "  ███████║ ██║  ██║██║ ╚═╝ ██║\n"+
  "  ╚══════╝ ╚═╝  ╚═╝╚═╝     ╚═╝";
  var LINES=[
    {t:"SRM BIOS v2.6.26 (c) Matison Systems",c:""},
    {t:"Detecting hardware...............",c:"ok",s:"[ OK ]"},
    {t:"CPU: Apache NiFi Quad-Core @ 4.2GHz",c:""},
    {t:"MEM: 640K conventional... 65536K extended [ OK ]",c:"ok"},
    {t:"Mounting /dev/cdp ...............",c:"ok",s:"[ OK ]"},
    {t:"Loading modules: kafka minifi k8s iceberg",c:""},
    {t:"Establishing edge-to-core link..",c:"warn",s:"[ WARN ]"},
    {t:"  retrying secure channel......",c:"ok",s:"[ OK ]"},
    {t:"Starting matrix daemon..........",c:"ok",s:"[ OK ]"},
    {t:"Authenticating user: srm........",c:"ok",s:"[ OK ]"},
    {t:"",c:""},
    {t:"SYSTEM READY. Launching interface_",c:"ok"}
  ];
  var boot=document.getElementById('boot'),log=document.getElementById('bootlog'),
      logo=document.getElementById('srmlogo'),art=document.getElementById('asciiart'),
      timers=[];

  function skip(){ boot.classList.add('done'); }

  // Respect reduced-motion and session replay
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var seen;
  try { seen = sessionStorage.getItem('srm_booted'); } catch(e){ seen = null; }

  if (seen || reduce){ skip(); return; }
  try { sessionStorage.setItem('srm_booted','1'); } catch(e){}

  document.body.classList.add('booting');
  var i=0;
  function typeLine(){
    if(i>=LINES.length){ timers.push(setTimeout(showLogo,250)); return; }
    var L=LINES[i++], cls=L.c?' class="'+L.c+'"':'',
        status=L.s?'  <span'+cls+'>'+L.s+'</span>':'';
    log.innerHTML+='<span'+cls+'>'+L.t+'</span>'+status+'\n';
    timers.push(setTimeout(typeLine,55+Math.random()*70));
  }
  function showLogo(){
    log.innerHTML+='<span class="cursor"></span>';
    logo.classList.add('show');
    var n=0;(function step(){art.textContent=ASCII.slice(0,n);n+=10;
      if(n<=ASCII.length)timers.push(setTimeout(step,10));})();
    timers.push(setTimeout(finish,1300));
  }
  function finish(){ boot.classList.add('done'); document.body.classList.remove('booting'); }

  // Safety net: never trap the user if something stalls
  timers.push(setTimeout(finish,4000));
  timers.push(setTimeout(typeLine,200));
})();
</script>
